# .ruff.toml válido
# Exclude a variety of commonly ignored directories.
exclude = ["__pycache__", ".venv", "venv"]
# Assume Python 3.12
target-version = "py312"

[lint]
select = ["F", "E", "W", "I001", "T20", "N", "B", "UP", "SIM", "RUF"]

ignore = ["E501"]

per-file-ignores = {}

[lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[lint.pep8-naming]
ignore-names = []
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[lint.pylint]
max-args = 3
max-branches = 12
max-returns = 6
max-statements = 50
